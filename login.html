<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Clientes | Agente Web</title>
    <link rel="icon" type="image/jpeg" href="assets/img/logo-agente-web.jpg">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #050507;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15), transparent 40%),
                radial-gradient(circle at 0% 50%, rgba(139, 92, 246, 0.08), transparent 30%);
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: #fff;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 2;
        }

        .login-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            letter-spacing: -0.05em;
        }

        .login-logo .dot {
            color: #06b6d4;
            font-size: 2.5rem;
            line-height: 0;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            transition: 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .btn-login-submit {
            width: 100%;
            padding: 1rem;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
            font-size: 1rem;
        }

        .btn-login-submit:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(255, 255, 255, 0.2);
        }

        .links {
            margin-top: 2rem;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .links a {
            color: #94a3b8;
            text-decoration: none;
            transition: 0.3s;
        }

        .links a:hover {
            color: #fff;
        }

        /* Subtle animated background grid */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            z-index: 1;
        }
    </style>
</head>

<body>

    <div class="bg-grid"></div>

    <div class="login-card">
        <a href="index.html" class="login-logo" aria-label="Agente Web - Inicio" style="display:flex; align-items:center; justify-content:center; gap:10px;">
            <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="16,2 29,9.5 29,22.5 16,30 3,22.5 3,9.5" stroke="url(#lg_aw1)" stroke-width="2" fill="rgba(6, 182, 212, 0.08)" stroke-linejoin="round"/>
                <path d="M9 22L13.5 10L16 17L18.5 10L23 22" stroke="url(#lg_aw2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M11 18H15" stroke="url(#lg_aw2)" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="16" cy="2" r="1.8" fill="#06b6d4"/>
                <circle cx="29" cy="9.5" r="1.8" fill="#3b82f6"/>
                <circle cx="29" cy="22.5" r="1.8" fill="#8b5cf6"/>
                <circle cx="16" cy="30" r="1.8" fill="#ec4899"/>
                <circle cx="3" cy="22.5" r="1.8" fill="#8b5cf6"/>
                <circle cx="3" cy="9.5" r="1.8" fill="#3b82f6"/>
                <defs>
                    <linearGradient id="lg_aw1" x1="3" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#8b5cf6"/>
                        <stop offset="0.5" stop-color="#3b82f6"/>
                        <stop offset="1" stop-color="#06b6d4"/>
                    </linearGradient>
                    <linearGradient id="lg_aw2" x1="9" y1="10" x2="23" y2="22" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#06b6d4"/>
                        <stop offset="0.6" stop-color="#3b82f6"/>
                        <stop offset="1" stop-color="#a855f7"/>
                    </linearGradient>
                </defs>
            </svg>
            <span>Agente<span style="color: #06b6d4;">Web</span></span>
        </a>
        <p class="subtitle">Acceso seguro a Portal Cliente</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Email Corporativo</label>
                <input type="email" id="email" placeholder="nombre@empresa.com" required>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login-submit">Iniciar Sesión</button>
        </form>

        <div class="links">
            <a href="index.html">← Volver</a>
            <a href="signup.html">Crear Cuenta</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Validando...';
            btn.disabled = true;

            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.status === 'success') {
                    window.location.href = result.redirect || 'portal/index.html';
                } else {
                    alert(result.message);
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                // Demo fallback
                window.location.href = 'portal/dashboard.php';
            }
        });
    </script>

</body>

</html>
